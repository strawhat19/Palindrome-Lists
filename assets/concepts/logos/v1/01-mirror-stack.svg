  <title id="mirror-stack-title">Palindrome Lists — Mirror Stack</title>
  <desc id="mirror-stack-description">A bold, rounded PL above the same pair reflected from left to right. The lower row reverses both the order and shapes of the letters.</desc>
  <defs>
    <g id="mirror-stack-pair" fill="#171717">
      <path
        id="mirror-stack-letter-p"
