      />
      <path
        id="mirror-stack-letter-l"
        d="M191 44C200 44 206 51 206 60V118H249C257 118 264 125 264 133C264 141 257 148 249 148H191C183 148 176 141 176 133V60C176 51 183 44 191 44Z"
      />
    </g>
  </defs>
  <use
    id="mirror-stack-upper-pair"
    href="#mirror-stack-pair"
  />
  <use
    id="mirror-stack-lower-pair"
    href="#mirror-stack-pair"
    transform="matrix(-1 0 0 1 320 128)"
  />
</svg>
